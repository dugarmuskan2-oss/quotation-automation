<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — DSC Pipes</title>
<style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #f4f4f2; padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #2b2b2b;
    }
    .card {
        width: 100%; max-width: 380px; background: #fff; border-radius: 10px; padding: 32px 28px;
        box-shadow: 0 2px 14px rgba(0,0,0,.08); border: 1px solid #e7e5e0;
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
    .brand img { width: 46px; height: auto; }
    .brand h1 { font-size: 17px; margin: 0; letter-spacing: .01em; }
    .sub { color: #8a8781; font-size: 13px; margin: 2px 0 22px 58px; }
    label { display: block; font-size: 12px; color: #6f6c66; margin: 14px 0 5px; letter-spacing: .02em; }
    input {
        width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #d8d5ce;
        border-radius: 6px; background: #fcfcfb;
    }
    input:focus { outline: none; border-color: #3f51b5; background: #fff; }
    .hint { font-size: 11.5px; color: #9a978f; margin-top: 5px; }
    button {
        width: 100%; margin-top: 20px; padding: 11px; font-size: 15px; font-weight: 600;
        color: #fff; background: #3f51b5; border: 0; border-radius: 6px; cursor: pointer;
    }
    button:hover { background: #364495; }
    button[disabled] { background: #a8afd8; cursor: default; }
    .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .msg.bad { color: #A32D2D; }
    .msg.ok { color: #2E7D32; }
    .note { margin-top: 18px; font-size: 11.5px; color: #9a978f; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
    <div class="brand">
        <img src="/logo.png" alt="" onerror="this.style.display='none'">
        <h1>DSC Pipes and Tubes</h1>
    </div>
    <div class="sub">Quotation system</div>

    <form id="f" autocomplete="on">
        <label for="name">Your name or email</label>
        <input id="name" name="username" type="text" autocomplete="username" placeholder="Leave blank if you share one password">
        <div class="hint">Only needed if you have your own login.</div>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>

        <button id="go" type="submit">Sign in</button>
    </form>

    <div class="msg" id="msg"></div>
    <div class="note" id="note"></div>
</div>

<script>
    var msg = document.getElementById('msg');
    var note = document.getElementById('note');
    var go = document.getElementById('go');

    // Where to go afterwards: back where they were headed, but only ever a path on this site.
    // Taking a whole URL from the query string is how an open redirect gets built by accident.
    // A backslash counts as a slash to every browser's URL parser, so "/\evil.com" leaves the
    // site while passing a first-character check — it has to be rejected explicitly, along with
    // control characters. Kept identical to safeNextPath in utils/auth.js.
    function safeNext() {
        var raw = new URLSearchParams(location.search).get('next') || '/';
        if (raw.charAt(0) !== '/') return '/';
        if (/[\\\u0000-\u001F\u007F]/.test(raw)) return '/';
        if (raw.charAt(1) === '/') return '/';
        return raw;
    }

    fetch('/api/me').then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.signedIn) { location.replace(safeNext()); return; }
        if (d && !d.configured) {
            note.textContent = 'No password has been set for this site yet, so it is currently open to anyone with the address.';
        } else if (d && d.people === 0) {
            note.textContent = 'This site uses one shared password.';
        }
    }).catch(function () {});

    document.getElementById('f').addEventListener('submit', function (e) {
        e.preventDefault();
        msg.className = 'msg';
        msg.textContent = 'Checking…';
        go.disabled = true;                       // a second click must not be a second attempt
        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('name').value,
                password: document.getElementById('password').value
            })
        }).then(function (r) {
            return r.json().then(function (d) { return { ok: r.ok, d: d }; });
        }).then(function (res) {
            if (res.ok) {
                msg.className = 'msg ok';
                msg.textContent = 'Signed in. One moment…';
                location.replace(safeNext());
                return;
            }
            msg.className = 'msg bad';
            msg.textContent = (res.d && res.d.error) || 'That did not work.';
            go.disabled = false;
            document.getElementById('password').select();
        }).catch(function () {
            msg.className = 'msg bad';
            msg.textContent = 'Could not reach the server.';
            go.disabled = false;
        });
    });
</script>
</body>
</html>
