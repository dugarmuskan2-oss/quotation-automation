<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home — DSC Pipes</title>
<style>
    /* Same look as people.html and login.html, so the three pages feel like one site. */
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; background: #f4f4f2; padding: 40px 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #2b2b2b;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    .top { display: flex; align-items: center; gap: 12px; }
    .top img { width: 44px; height: auto; }
    .top h1 { font-size: 20px; margin: 0; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 28px 56px; }
    .hello { color: #8a8781; font-size: 13.5px; }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .tile {
        display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit;
        background: #fff; border: 1px solid #e7e5e0; border-radius: 10px; padding: 22px 22px 20px;
        transition: border-color .15s, box-shadow .15s;
    }
    .tile:hover { border-color: #3f51b5; box-shadow: 0 2px 10px rgba(63, 81, 181, .10); }
    .tile:focus-visible { outline: 2px solid #3f51b5; outline-offset: 2px; }
    .icon {
        width: 42px; height: 42px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
        background: #e6f1fb; color: #0c447c; font-size: 20px;
    }
    .tile.appraisal .icon { background: #eeedfe; color: #3c3489; }
    .tile h2 { font-size: 16px; margin: 4px 0 0; }
    .tile p { font-size: 13.5px; color: #6f6c66; margin: 0; line-height: 1.45; }
    .go { margin-top: auto; padding-top: 10px; font-size: 13px; font-weight: 600; color: #3f51b5; }
    .note { margin-top: 22px; font-size: 12.5px; color: #8a8781; line-height: 1.5; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
    <div class="top">
        <img src="/logo.png" alt="" onerror="this.style.display='none'">
        <h1>DSC Pipes and Tubes</h1>
    </div>
    <div class="bar">
        <span class="hello" id="hello">Where do you want to go?</span>
    </div>

    <div class="tiles">
        <a class="tile" href="/index.html">
            <span class="icon" aria-hidden="true">📄</span>
            <h2>Quotation app</h2>
            <p>Enquiries, quotes, freight, register and the partner directory.</p>
            <span class="go">Open →</span>
        </a>
        <a class="tile appraisal" href="/appraisal.html">
            <span class="icon" aria-hidden="true">📋</span>
            <h2>Performance appraisal</h2>
            <p>Quarterly self-reviews, manager scores and 6-month meetings.</p>
            <span class="go">Open →</span>
        </a>
    </div>

</div>

<script>
    // Say who is signed in. If this fails, the page still works — the greeting just stays generic.
    fetch('/api/me').then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.signedIn && d.who) {
            document.getElementById('hello').textContent = 'Signed in as ' + d.who + '. Where do you want to go?';
        }
    }).catch(function () {});
</script>
<script src="/account-badge.js?v=20261016-1"></script>
</body>
</html>
