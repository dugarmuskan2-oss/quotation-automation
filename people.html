<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People — DSC Pipes</title>
<style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; background: #f4f4f2; padding: 32px 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #2b2b2b;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
    .top img { width: 40px; height: auto; }
    .top h1 { font-size: 18px; margin: 0; }
    .sub { color: #8a8781; font-size: 13px; margin: 3px 0 24px 52px; }
    .back { display: inline-block; margin-bottom: 18px; font-size: 13px; color: #6f6c66; text-decoration: none; }
    .back:hover { text-decoration: underline; }

    .card { background: #fff; border: 1px solid #e7e5e0; border-radius: 10px; padding: 20px 22px; }
    .card + .card { margin-top: 20px; }
    .card h2 { font-size: 14px; margin: 0 0 2px; }
    .card .hint { font-size: 12.5px; color: #8a8781; margin: 0 0 14px; }

    .row {
        display: flex; align-items: center; gap: 12px; padding: 12px 0;
        border-bottom: 1px solid #eeece6;
    }
    .row:last-child { border-bottom: none; }
    .avatar {
        width: 34px; height: 34px; border-radius: 50%; background: #e6f1fb; color: #0c447c;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 600; flex: none;
    }
    .row .who { flex: 1; min-width: 0; }
    .row .name { font-size: 14px; font-weight: 600; }
    .row .email { font-size: 12.5px; color: #8a8781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge {
        font-size: 11px; padding: 3px 9px; border-radius: 5px; flex: none;
        background: #f1efe8; color: #444441;
    }
    .badge.google { background: #e6f1fb; color: #0c447c; }
    .you-tag { font-size: 11.5px; color: #b0aea6; width: 58px; text-align: right; flex: none; }
    .remove-btn {
        font-size: 12px; padding: 5px 10px; border: 1px solid #e7d4d0; border-radius: 5px;
        background: #fff; color: #A32D2D; cursor: pointer; flex: none;
    }
    .remove-btn:hover { background: #fcebeb; }
    .remove-btn[disabled] { opacity: .5; cursor: default; }
    .empty { font-size: 13px; color: #8a8781; padding: 8px 0; }

    label { display: block; font-size: 12px; color: #6f6c66; margin: 12px 0 5px; }
    label:first-of-type { margin-top: 4px; }
    input[type="text"], input[type="email"], input[type="password"] {
        width: 100%; padding: 9px 11px; font-size: 14.5px; border: 1px solid #d8d5ce;
        border-radius: 6px; background: #fcfcfb;
    }
    input:focus { outline: none; border-color: #3f51b5; background: #fff; }
    .method { display: flex; gap: 20px; margin-top: 14px; }
    .method label { display: flex; align-items: center; gap: 7px; margin: 0; font-size: 13.5px; color: #2b2b2b; }
    .method input[type="radio"] { width: auto; margin: 0; }
    button.primary {
        margin-top: 16px; padding: 9px 18px; font-size: 14px; font-weight: 600;
        color: #fff; background: #3f51b5; border: 0; border-radius: 6px; cursor: pointer;
    }
    button.primary:hover { background: #364495; }
    button.primary[disabled] { background: #a8afd8; cursor: default; }
    .msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
    .msg.bad { color: #A32D2D; }
    .msg.ok { color: #2E7D32; }
    [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
    <a class="back" href="/">&larr; Back to the app</a>
    <div class="top">
        <img src="/logo.png" alt="" onerror="this.style.display='none'">
        <h1>People</h1>
    </div>
    <div class="sub">Who can sign in to this site</div>

    <div class="card">
        <h2>Signed in</h2>
        <p class="hint">Everyone who can open this site right now.</p>
        <div id="list"><div class="empty">Loading…</div></div>
    </div>

    <div class="card">
        <h2>Add someone</h2>
        <p class="hint" id="addHint">Give them a way in.</p>

        <form id="addForm">
            <label for="name">Full name</label>
            <input id="name" type="text" placeholder="Jane Smith" required>

            <label for="email">Email</label>
            <input id="email" type="email" placeholder="jane@dscpipes.com" required>

            <div class="method">
                <label><input type="radio" name="method" value="google" checked> Signs in with Google</label>
                <label><input type="radio" name="method" value="password"> Set a password</label>
            </div>

            <div id="passwordFields" hidden>
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password">
                <label for="confirmPassword">Type it again</label>
                <input id="confirmPassword" type="password" autocomplete="new-password">
            </div>

            <button class="primary" id="addBtn" type="submit">Add</button>
            <div class="msg" id="addMsg"></div>
        </form>
    </div>
</div>

<script>
    var listEl = document.getElementById('list');
    var addForm = document.getElementById('addForm');
    var addBtn = document.getElementById('addBtn');
    var addMsg = document.getElementById('addMsg');
    var addHint = document.getElementById('addHint');
    var passwordFields = document.getElementById('passwordFields');
    var youEmail = null;

    function esc(s) {
        var d = document.createElement('div');
        d.textContent = String(s == null ? '' : s);
        return d.innerHTML;
    }
    function initials(name) {
        var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return '?';
        return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
    }

    function renderList(people) {
        if (!people.length) { listEl.innerHTML = '<div class="empty">Nobody has been added yet.</div>'; return; }
        listEl.innerHTML = people.map(function (p) {
            var mine = youEmail && p.email && youEmail.toLowerCase() === p.email.toLowerCase();
            var badge = p.kind === 'google' ? 'Google' : 'Password';
            var right = mine
                ? '<span class="you-tag">you</span>'
                : '<button class="remove-btn" type="button" data-email="' + esc(p.email) + '">Remove</button>';
            return '<div class="row">'
                + '<div class="avatar">' + esc(initials(p.name)) + '</div>'
                + '<div class="who"><div class="name">' + esc(p.name) + '</div><div class="email">' + esc(p.email) + '</div></div>'
                + '<span class="badge ' + (p.kind === 'google' ? 'google' : '') + '">' + badge + '</span>'
                + right
                + '</div>';
        }).join('');
    }

    // Deliberately not confirm(): a native confirm() dialog is easy to click through on reflex,
    // and this action is exactly the kind of thing a reflex click on the wrong row would regret.
    // The button disables itself and reverts on any failure, so a slow tap is never a lost click
    // and a fast double-tap can only ever remove one person.
    function bindRemoveButtons() {
        Array.prototype.forEach.call(listEl.querySelectorAll('.remove-btn'), function (btn) {
            btn.addEventListener('click', function () {
                var email = btn.getAttribute('data-email');
                btn.disabled = true;
                btn.textContent = 'Removing…';
                fetch('/api/people/remove', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
                  .then(function (res) {
                    if (!res.ok) {
                        alert((res.d && res.d.error) || 'Could not remove them.');
                        btn.disabled = false; btn.textContent = 'Remove';
                        return;
                    }
                    load();
                });
            });
        });
    }

    function load() {
        return fetch('/api/people').then(function (r) {
            if (r.status === 401) { location.href = '/login.html?next=' + encodeURIComponent(location.pathname); return null; }
            return r.json();
        }).then(function (d) {
            if (!d) return;
            youEmail = d.you;
            renderList(d.people || []);
            bindRemoveButtons();
            if (!d.people || !d.people.length) {
                addHint.textContent = 'Add yourself first — this site stays open to anyone until someone is on the list.';
            } else {
                addHint.textContent = 'Give them a way in.';
            }
        }).catch(function () {
            listEl.innerHTML = '<div class="empty">Could not reach the server.</div>';
        });
    }

    Array.prototype.forEach.call(document.querySelectorAll('input[name="method"]'), function (r) {
        r.addEventListener('change', function () {
            passwordFields.hidden = (document.querySelector('input[name="method"]:checked').value !== 'password');
        });
    });

    addForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var method = document.querySelector('input[name="method"]:checked').value;
        var name = document.getElementById('name').value.trim();
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;

        addMsg.className = 'msg';
        if (!name) { addMsg.className = 'msg bad'; addMsg.textContent = 'Enter a name.'; return; }
        if (!email) { addMsg.className = 'msg bad'; addMsg.textContent = 'Enter an email address.'; return; }
        if (method === 'password') {
            if (password.length < 8) { addMsg.className = 'msg bad'; addMsg.textContent = 'Use a password of at least 8 characters.'; return; }
            if (password !== confirmPassword) { addMsg.className = 'msg bad'; addMsg.textContent = 'Those passwords did not match.'; return; }
        }

        addBtn.disabled = true;                     // a second click must not be a second attempt
        addMsg.textContent = 'Adding…';
        fetch('/api/people', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, email: email, method: method, password: password, confirmPassword: confirmPassword })
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            addBtn.disabled = false;
            if (!res.ok) {
                addMsg.className = 'msg bad';
                addMsg.textContent = (res.d && res.d.error) || 'That did not work.';
                return;
            }
            addMsg.className = 'msg ok';
            addMsg.textContent = name + ' can now sign in.';
            addForm.reset();
            passwordFields.hidden = true;
            load();
        }).catch(function () {
            addBtn.disabled = false;
            addMsg.className = 'msg bad';
            addMsg.textContent = 'Could not reach the server.';
        });
    });

    load();
</script>
</body>
</html>
