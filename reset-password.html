<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — DSC Pipes</title>
<style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #f4f4f2; padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #2b2b2b;
    }
    .card {
        width: 100%; max-width: 380px; background: #fff; border-radius: 10px; padding: 30px 28px 26px;
        box-shadow: 0 2px 14px rgba(0,0,0,.08); border: 1px solid #e7e5e0;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 44px; height: auto; }
    .brand h1 { font-size: 16.5px; margin: 0; letter-spacing: .01em; }
    .sub { color: #8a8781; font-size: 12.5px; margin: 3px 0 22px 56px; }

    .gbtn {
        width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
        padding: 10px; font-size: 14.5px; font-weight: 500; color: #3c4043;
        background: #fff; border: 1px solid #dadce0; border-radius: 6px; cursor: pointer;
        text-decoration: none;
    }
    .gbtn:hover { background: #f8f9fa; border-color: #d2d5d9; }
    .gbtn svg { width: 18px; height: 18px; flex: none; }

    .or { display: flex; align-items: center; gap: 12px; margin: 20px 0 4px; color: #a9a69f; font-size: 11.5px; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: #eae7e1; }

    label { display: block; font-size: 12px; color: #6f6c66; margin: 14px 0 5px; letter-spacing: .02em; }
    input {
        width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #d8d5ce;
        border-radius: 6px; background: #fcfcfb;
    }
    input:focus { outline: none; border-color: #3f51b5; background: #fff; }
    button.primary {
        width: 100%; margin-top: 18px; padding: 11px; font-size: 15px; font-weight: 600;
        color: #fff; background: #3f51b5; border: 0; border-radius: 6px; cursor: pointer;
    }
    button.primary:hover { background: #364495; }
    button.primary[disabled] { background: #a8afd8; cursor: default; }
    .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .msg.bad { color: #A32D2D; }
    .msg.ok { color: #2E7D32; }
    .note { margin-top: 16px; font-size: 11.5px; color: #9a978f; line-height: 1.5; }
    [hidden] { display: none !important; }
    .back { display: block; margin-top: 16px; font-size: 12.5px; color: #6f6c66; text-align: center; }
</style>
</head>
<body>
<div class="card">
    <div class="brand">
        <img src="/logo.png" alt="" onerror="this.style.display='none'">
        <h1>DSC Pipes and Tubes</h1>
    </div>
    <div class="sub" id="sub">Reset your password</div>

    <!-- No token: ask for a link. The link goes to the office mailbox, never to the address typed. -->
    <form id="ask" hidden>
        <label for="email">Your email</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@dscpipes.com" required>
        <button class="primary" id="askBtn" type="submit">Send reset link</button>
        <div class="note">The link is sent to the office (info@dscpipes.com). They will pass it to you.</div>
    </form>

    <!-- With a token: set the new password. -->
    <form id="set" hidden>
        <label for="pw">New password</label>
        <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
        <label for="pw2">Type it again</label>
        <input id="pw2" type="password" autocomplete="new-password" required>
        <button class="primary" id="setBtn" type="submit">Set password</button>
    </form>

    <div class="msg" id="msg"></div>
    <a class="back" href="/login.html">&larr; Back to sign in</a>
</div>

<script>
    var msg = document.getElementById('msg');
    var token = new URLSearchParams(location.search).get('token');
    function say(cls, text) { msg.className = 'msg ' + cls; msg.textContent = text; }
    function post(url, body) {
        return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
            .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); })
            .catch(function () { return { ok: false, d: { error: 'Could not reach the server.' } }; });
    }

    if (!token) {
        var ask = document.getElementById('ask'), askBtn = document.getElementById('askBtn');
        ask.hidden = false;
        ask.addEventListener('submit', function (e) {
            e.preventDefault();
            if (askBtn.disabled) return;
            askBtn.disabled = true;                 // one click, one email
            say('', 'Sending…');
            post('/api/password-reset/request', { email: document.getElementById('email').value }).then(function (res) {
                if (!res.ok) { askBtn.disabled = false; say('bad', (res.d && res.d.error) || 'That did not work.'); return; }
                // Same words whether or not the address is on the list.
                say('ok', 'If that email can sign in, a reset link is on its way to ' + (res.d.sentTo || 'the office') + '. Ask them for it — it works once, for 30 minutes.');
            });
        });
    } else {
        document.getElementById('sub').textContent = 'Choose a new password';
        var set = document.getElementById('set'), setBtn = document.getElementById('setBtn');
        set.hidden = false;
        set.addEventListener('submit', function (e) {
            e.preventDefault();
            var pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
            if (pw.length < 8) { say('bad', 'Use a password of at least 8 characters.'); return; }
            if (pw !== pw2) { say('bad', 'Those passwords did not match.'); return; }
            if (setBtn.disabled) return;
            setBtn.disabled = true;
            say('', 'Saving…');
            post('/api/password-reset/complete', { token: token, password: pw, confirmPassword: pw2 }).then(function (res) {
                if (!res.ok) { setBtn.disabled = false; say('bad', (res.d && res.d.error) || 'That did not work.'); return; }
                set.hidden = true;
                say('ok', 'Done. You can sign in with your new password now.');
                history.replaceState(null, '', '/reset-password.html');   // the link is used up; don't leave it in the address bar
            });
        });
    }
</script>
</body>
</html>
